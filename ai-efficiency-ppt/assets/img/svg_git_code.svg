<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
    <defs>
        <linearGradient id="bg-git_code" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f3f4f6" />
            <stop offset="100%" stop-color="#e5e7eb" />
        </linearGradient>
        <linearGradient id="accent-git_code" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#374151" />
            <stop offset="100%" stop-color="#1f2937" />
        </linearGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d1d5db" stroke-width="1" />
        </pattern>
        
    </defs>
    <rect width="100%" height="100%" fill="url(#bg-git_code)" />
    <rect width="100%" height="100%" fill="url(#grid)" opacity="0.5" />
    
    <g transform="translate(400, 200)">
        
            <path d="M -20 -80 L 20 -80 L 60 -40 L 60 80 L -60 80 L -60 -40 Z" fill="#fff" stroke="#1f2937" stroke-width="4"/>
            <circle cx="-20" cy="-20" r="10" fill="#374151"/>
            <circle cx="-20" cy="40" r="10" fill="#374151"/>
            <circle cx="20" cy="10" r="10" fill="#1f2937"/>
            <line x1="-20" y1="-10" x2="-20" y2="30" stroke="#374151" stroke-width="4"/>
            <path d="M -20 -20 Q 20 -20 20 0" fill="none" stroke="#374151" stroke-width="4"/>
            
            <text x="0" y="120" font-family="monospace" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">git commit -m "Auto"</text>
        
    </g>
    
    <text x="30" y="40" font-family="-apple-system, sans-serif" font-size="24" font-weight="bold" fill="#111827" letter-spacing="1">GITHUB REPO</text>
    <text x="30" y="70" font-family="-apple-system, sans-serif" font-size="14" font-weight="normal" fill="#4b5563">Version Control & Sync</text>
    
    <rect x="0" y="390" width="800" height="10" fill="url(#accent-git_code)" />
</svg>