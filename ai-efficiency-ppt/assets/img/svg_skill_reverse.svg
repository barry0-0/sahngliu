<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <defs>
        <linearGradient id="bg-skill_reverse" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f8fafc" />
            <stop offset="100%" stop-color="#f1f5f9" />
        </linearGradient>
        <linearGradient id="accent-skill_reverse" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#374151" />
            <stop offset="100%" stop-color="#1f2937" />
        </linearGradient>
        <pattern id="grid-skill_reverse" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8f0" stroke-width="1" />
        </pattern>
        
    </defs>
    
    <rect width="100%" height="100%" fill="url(#bg-skill_reverse)" />
    <rect width="100%" height="100%" fill="url(#grid-skill_reverse)" opacity="0.6" />
    
    <svg viewBox="0 0 1000 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
        <g transform="translate(500, 150)">
            
            <rect x="-300" y="-80" width="600" height="160" rx="16" fill="#e5e7eb" stroke="#9ca3af" stroke-width="6"/>
            <circle cx="-150" cy="0" r="50" fill="#cbd5e1"/>
            <rect x="-50" y="-30" width="260" height="20" rx="10" fill="#9ca3af"/>
            <rect x="-50" y="10" width="180" height="20" rx="10" fill="#9ca3af"/>
        
        </g>
    </svg>
    
    <rect x="0" y="100%" transform="translate(0, -6)" width="100%" height="6" fill="url(#accent-skill_reverse)" />
</svg>