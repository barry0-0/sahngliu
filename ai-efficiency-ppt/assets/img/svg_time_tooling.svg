<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <defs>
        <linearGradient id="bg-time_tooling" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f8fafc" />
            <stop offset="100%" stop-color="#f1f5f9" />
        </linearGradient>
        <linearGradient id="accent-time_tooling" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#374151" />
            <stop offset="100%" stop-color="#1f2937" />
        </linearGradient>
        <pattern id="grid-time_tooling" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8f0" stroke-width="1" />
        </pattern>
        
    </defs>
    
    <rect width="100%" height="100%" fill="url(#bg-time_tooling)" />
    <rect width="100%" height="100%" fill="url(#grid-time_tooling)" opacity="0.6" />
    
    <svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
        <g transform="translate(200, 200)">
            
            <line x1="0" y1="-200" x2="0" y2="200" stroke="#cbd5e1" stroke-width="6"/>
            <circle cx="0" cy="0" r="60" fill="#8b5cf6"/>
            <rect x="-20" y="-30" width="40" height="30" fill="none" stroke="#fff" stroke-width="6" rx="4"/>
            <line x1="-10" y1="-15" x2="5" y2="-15" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
            <path d="M -15 15 C 0 35 15 35 15 15" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
        
        </g>
    </svg>
    
    <rect x="0" y="100%" transform="translate(0, -6)" width="100%" height="6" fill="url(#accent-time_tooling)" />
</svg>