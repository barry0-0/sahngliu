<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <defs>
        <linearGradient id="bg-workflow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f8fafc" />
            <stop offset="100%" stop-color="#f1f5f9" />
        </linearGradient>
        <linearGradient id="accent-workflow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#374151" />
            <stop offset="100%" stop-color="#1f2937" />
        </linearGradient>
        <pattern id="grid-workflow" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8f0" stroke-width="1" />
        </pattern>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" /></marker>
    </defs>
    
    <rect width="100%" height="100%" fill="url(#bg-workflow)" />
    <rect width="100%" height="100%" fill="url(#grid-workflow)" opacity="0.6" />
    
    <svg viewBox="0 0 1000 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
        <g transform="translate(500, 150)">
            
            <circle cx="-300" cy="0" r="50" fill="#1f2937"/>
            <line x1="-230" y1="0" x2="-160" y2="0" stroke="#9ca3af" stroke-width="6" marker-end="url(#arrow)"/>
            <rect x="-130" y="-50" width="120" height="100" rx="12" fill="#3b82f6"/>
            <line x1="10" y1="0" x2="80" y2="0" stroke="#9ca3af" stroke-width="6" marker-end="url(#arrow)"/>
            <rect x="110" y="-50" width="120" height="100" rx="12" fill="#10b981"/>
            <line x1="250" y1="0" x2="320" y2="0" stroke="#9ca3af" stroke-width="6" marker-end="url(#arrow)"/>
            <circle cx="390" cy="0" r="50" fill="#f59e0b"/>
        
        </g>
    </svg>
    
    <rect x="0" y="100%" transform="translate(0, -6)" width="100%" height="6" fill="url(#accent-workflow)" />
</svg>