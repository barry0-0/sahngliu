<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <defs>
        <linearGradient id="bg-data_dict" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f8fafc" />
            <stop offset="100%" stop-color="#f1f5f9" />
        </linearGradient>
        <linearGradient id="accent-data_dict" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#374151" />
            <stop offset="100%" stop-color="#1f2937" />
        </linearGradient>
        <pattern id="grid-data_dict" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8f0" stroke-width="1" />
        </pattern>
        
    </defs>
    
    <rect width="100%" height="100%" fill="url(#bg-data_dict)" />
    <rect width="100%" height="100%" fill="url(#grid-data_dict)" opacity="0.6" />
    
    <svg viewBox="0 0 1000 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
        <g transform="translate(500, 150)">
            
            <rect x="-350" y="-80" width="700" height="160" rx="8" fill="#fff" stroke="#1f2937" stroke-width="6"/>
