<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
    <defs>
        <linearGradient id="bg-prototype_mall" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f8fafc" />
            <stop offset="100%" stop-color="#f1f5f9" />
        </linearGradient>
        <linearGradient id="accent-prototype_mall" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#374151" />
            <stop offset="100%" stop-color="#1f2937" />
        </linearGradient>
        <pattern id="grid-prototype_mall" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8f0" stroke-width="1" />
        </pattern>
        
    </defs>
    <rect width="100%" height="100%" fill="url(#bg-prototype_mall)" />
    <rect width="100%" height="100%" fill="url(#grid-prototype_mall)" opacity="0.6" />
    
    <g transform="translate(400, 180)">
        
            <rect x="-260" y="-95" width="520" height="180" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
            <rect x="-260" y="-95" width="520" height="30" fill="#f1f5f9"/>
            <text x="-240" y="-75" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">Buyer Mall Wireframe</text>
            
            <rect x="-240" y="-50" width="140" height="115" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
            <rect x="-225" y="-35" width="110" height="50" rx="4" fill="#cbd5e1"/>
            <rect x="-225" y="25" width="80" height="15" rx="3" fill="#0f172a"/>
            
            <rect x="-80" y="-50" width="150" height="115" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
            <rect x="-65" y="-35" width="120" height="20" rx="4" fill="#e2e8f0"/>
            <rect x="-65" y="-5" width="120" height="20" rx="4" fill="#e2e8f0"/>
            <rect x="-65" y="25" width="120" height="20" rx="4" fill="#3b82f6"/>
            
            <rect x="90" y="-50" width="150" height="115" rx="6" fill="#1e293b"/>
            <text x="165" y="-20" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Checkout</text>
            <rect x="110" y="10" width="110" height="30" rx="6" fill="#10b981"/>
            <text x="165" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Pay Now</text>
        
    </g>
    
    <text x="24" y="32" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#0f172a" letter-spacing="0.5">BUYER MALL PROTOTYPE UI</text>
    <text x="24" y="52" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748b">Interactive Shopping Hall & Cart Flow Wireframe</text>
    
    <rect x="0" y="354" width="800" height="6" fill="url(#accent-prototype_mall)" />
</svg>