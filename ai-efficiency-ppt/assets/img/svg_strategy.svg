<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
    <defs>
        <linearGradient id="bg-strategy" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f3f4f6" />
            <stop offset="100%" stop-color="#e5e7eb" />
        </linearGradient>
        <linearGradient id="accent-strategy" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#374151" />
            <stop offset="100%" stop-color="#1f2937" />
        </linearGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d1d5db" stroke-width="1" />
        </pattern>
        
    </defs>
    <rect width="100%" height="100%" fill="url(#bg-strategy)" />
    <rect width="100%" height="100%" fill="url(#grid)" opacity="0.5" />
    
    <g transform="translate(400, 200)">
        
            <rect x="-120" y="-90" width="240" height="160" rx="8" fill="#fff" stroke="#1f2937" stroke-width="4"/>
            <rect x="-100" y="-70" width="200" height="40" rx="4" fill="#f3f4f6"/>
            <rect x="-100" y="-20" width="90" height="70" rx="4" fill="#1f2937"/>
            <rect x="0" y="-20" width="100" height="70" rx="4" fill="#e5e7eb"/>
            
            <circle cx="-55" cy="15" r="20" fill="#fff"/>
            <path d="M 10 10 L 90 10 M 10 30 L 70 30 M 10 50 L 80 50" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/>
            
            <path d="M 120 0 L 160 0 L 140 30 Z" fill="#374151" transform="rotate(90 140 15)"/>
        
    </g>
    
    <text x="30" y="40" font-family="-apple-system, sans-serif" font-size="24" font-weight="bold" fill="#111827" letter-spacing="1">STRATEGY PPT ANALYSIS</text>
    <text x="30" y="70" font-family="-apple-system, sans-serif" font-size="14" font-weight="normal" fill="#4b5563">Data Parsing & Insights</text>
    
    <rect x="0" y="390" width="800" height="10" fill="url(#accent-strategy)" />
</svg>