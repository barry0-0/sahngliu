<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Slide 1 - 封面</title>
    <style>
        :root {
            --bg: #ffffff;
            --primary: #090d16;
            --accent: #171717; /* 高级碳黑 / Obsidian Black */
            --accent-bg: #f5f5f5;
            --accent-border: #d4d4d4;
            --text-main: #090d16;
            --text-sub: #525252;
            --border: #e5e5e5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 100vw; height: 100vh; background: var(--bg); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
            padding: 80px 100px; position: relative;
        }
        .top-stripe { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: #000000; }
        
        .tag-pill {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--accent-bg); border: 1px solid var(--accent-border); color: #171717;
            font-size: 14px; font-weight: 700; padding: 6px 16px; border-radius: 4px;
            width: fit-content; text-transform: uppercase; letter-spacing: 0.5px;
            animation: slideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .main-title {
            font-size: 52px; font-weight: 800; line-height: 1.25; color: #090d16; margin: 24px 0 16px 0;
            letter-spacing: -0.5px;
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .main-title span { color: #000000; text-decoration: underline; text-underline-offset: 8px; text-decoration-thickness: 3px; }
        .sub-title {
            font-size: 22px; color: var(--text-sub); line-height: 1.6; max-width: 1200px; font-weight: 400;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .speaker-box {
            background: #ffffff; border: 1px solid var(--border); border-left: 4px solid #000000;
            padding: 24px 32px; border-radius: 4px; display: flex; align-items: center; justify-content: space-between;
            margin-top: 40px; box-shadow: 0 4px 16px rgba(0,0,0,0.03);
            animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .speaker-info { display: flex; align-items: center; gap: 20px; }
        .avatar {
            width: 56px; height: 56px; background: #171717; color: #ffffff;
            border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px;
        }
        .speaker-name { font-size: 20px; font-weight: 700; color: #090d16; }
        .speaker-desc { font-size: 14px; color: #737373; margin-top: 2px; }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="top-stripe"></div>

    <div style="margin-top: 40px;">
        <div class="tag-pill">AI 生产力与产品敏捷实践</div>
        <h1 class="main-title">AI 辅助研发与敏捷实践探索：<br>从个人工具创新到<span>项目快速落地闭环</span></h1>
        <p class="sub-title">
            全方位探索 AI 在产品设计与研发中的实际应用：从早期的系统级原生 Agent 尝试，到借助 AI 为产品提效实现敏捷开发推进。
        </p>
    </div>

    <div class="speaker-box">
        <div class="speaker-info">
            <div class="avatar">周</div>
            <div>
                <div class="speaker-name">周鑫</div>
                <div class="speaker-desc">产品敏捷实践分享 · S2B2B 交易平台</div>
            </div>
        </div>
    </div>
</body>
</html>
